<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Emotion & Sentiment Analyzer</title>
    <link href="https://fonts.googleapis.com/css?family=Segoe+UI:400,600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px 30px 30px;
            text-align: center;
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }
        .auth-desc {
            color: #888;
            margin-bottom: 30px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .auth-input {
            padding: 14px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .auth-input:focus {
            border-color: #667eea;
            outline: none;
        }
        .auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .auth-btn:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .auth-link {
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
        }
        .auth-link:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #c33;
            background: #fee;
            border-left: 4px solid #c33;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .success-message {
            color: #2d8a34;
            background: #e6ffe6;
            border-left: 4px solid #2d8a34;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-title">Sign In</div>
        <div class="auth-desc">Welcome back! Please log in to continue.</div>
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        {% if message %}
            <div class="success-message">{{ message }}</div>
        {% endif %}
        <form class="auth-form" method="post" action="/login">
            <input class="auth-input" type="text" name="identifier" placeholder="Username or Email" required>
            <input class="auth-input" type="password" name="password" placeholder="Password" required>
            <button class="auth-btn" type="submit">Sign In</button>
        </form>
        <a class="auth-link" href="/register">Don't have an account? Sign up</a>
    </div>
</body>
</html>
